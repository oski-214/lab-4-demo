<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Copilot High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>GitHub Copilot High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@githubcopilot.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>

      <section id="assistant-container">
        <h3>AI Assistant</h3>
        <p class="assistant-description">Ask questions about activities or sign up students using natural language.</p>
        <div id="chat-messages">
          <!-- Chat messages will appear here -->
        </div>
        <form id="chat-form">
          <div class="chat-input-group">
            <input type="text" id="chat-input" placeholder="Ask about activities or sign someone up..." />
            <button type="submit" id="chat-submit">Send</button>
          </div>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2023 GitHub Copilot High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
